<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tablero de Puntos - DOM y JavaScript</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
</head>
<body>
    <div class="container my-1 my-sm-2 my-md-4 my-lg-5">
        <h1>Tablero de Puntos</h1>
        <div class="card">
            <div class="card-body">
                <div class="row text-center">
                    <div class="col-5">
                        <span class="display-1" id="numerolocal">0</span>
                        <p class="m-0">Local</p>
                    </div>
                    <div class="col-2">
                        <span class="display-1">:</span>
                    </div>
                    <div class="col-5">
                        <span class="display-1" id="numerovisitante">0</span>
                        <p class="m-0">Visitante</p>
                    </div>
                </div>

                <hr class="hr">

                <h2>Actualizar Contador</h2>
                <div class="row">
                    <div class="col-12 col-sm-4 my-1">
                        <button class="btn d-block w-100 btn-primary btn-accion" id="puntoLocal">
                            Punto Local
                        </button>
                    </div>
                    <div class="col-12 col-sm-4 my-1">
                        <button class="btn d-block w-100 btn-primary btn-accion" id="puntoVisitante">
                            Punto Visitante
                        </button>
                    </div>
                    <div class="col-12 col-sm-4 my-1">
                        <button class="btn d-block w-100 btn-danger" id="reinicio">
                            Reinicio
                        </button>
                    </div>
                    <div class="col-12 col-sm-4 my-1">
                        <button class="btn d-block w-100 btn-danger btn-accion" id="restarlocal">
                            Restar local
                        </button>
                    </div>    
                    <div class="col-12 col-sm-4 my-1">
                        <button class="btn d-block w-100 btn-danger btn-accion" id="restarvisitante">
                            Restar visitante
                        </button>
                    </div>
                    <div class="col-12 col-sm-4 my-1">
                        <button class="btn d-block w-100 btn-danger btn-accion" id="invertir">
                            Invertir
                        </button>
                    </div>
                    <div class="col-12 col-sm-12 my-1">
                        <button class="btn d-block w-100 btn-danger" id="finalizar">
                            Finalizar
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

<script>
    let local = 0;
    let visitante = 0;
    let aux = 0;

    // Asignación de event listeners directamente a las etiquetas <button>
    document.querySelector('#puntoLocal').addEventListener('click', sumarlocal);
    document.querySelector('#puntoVisitante').addEventListener('click', sumarvisitante);
    document.querySelector('#reinicio').addEventListener('click', reiniciarpuntaje);
    document.querySelector('#restarlocal').addEventListener('click', restarlocal);
    document.querySelector('#restarvisitante').addEventListener('click', restarvisitante);
    document.querySelector('#invertir').addEventListener('click', invertirnum);
    document.querySelector('#finalizar').addEventListener('click', finalizarpar);

    function sumarlocal() {
        local++;
        document.querySelector('#numerolocal').innerText = local;
    }

    function sumarvisitante() {
        visitante++;
        document.querySelector('#numerovisitante').innerText = visitante;
    }

    function reiniciarpuntaje() {
        local = 0;
        visitante = 0;
        document.querySelector('#numerovisitante').innerText = visitante;
        document.querySelector('#numerolocal').innerText = local;

        // Vuelve a habilitar todos los botones de acción al reiniciar
        const botonesAccion = document.querySelectorAll('.btn-accion');
        botonesAccion.forEach(boton => boton.disabled = false);
    }

    function restarlocal() {
        local--;
        document.querySelector('#numerolocal').innerText = local;
    }

    function restarvisitante() {
        visitante--;
        document.querySelector('#numerovisitante').innerText = visitante;
    }

    function invertirnum() {
        aux = visitante;
        visitante = local;
        local = aux;
        document.querySelector('#numerovisitante').innerText = visitante;
        document.querySelector('#numerolocal').innerText = local;
    }

    function finalizarpar() {
        // Deshabilita únicamente los botones de puntuación y modificación
        const botonesAccion = document.querySelectorAll('.btn-accion');
        botonesAccion.forEach(boton => boton.disabled = true);
    }
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>
</body>
</html>
