<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Editor de Texto - DOM y JavaScript</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <style>
        /* Clases CSS personalizadas para aplicar estilos al texto */
        .negrita { font-weight: bold; }
        .cursiva { font-style: italic; }
        .subrayado { text-decoration: underline; }
        .color-destacado { color: #d9534f; }
    </style>
</head>
<body>
    <div class="container my-1 my-sm-2 my-md-4 my-lg-5">
        <h1>Editor de Texto</h1>
        
        <!-- Campo para editar el texto en tiempo real -->
        <div class="mb-3">
            <label for="input-texto" class="form-label fw-bold">Editar contenido del texto:</label>
            <input type="text" id="input-texto" class="form-control" value="Lorem ipsum dolor sit amet, consectetur adipiscing elit. Donec elementum auctor libero, vel imperdiet est. Etiam blandit facilisis ex, nec cursus metus pharetra quis. Fusce imperdiet nisl nibh, ac aliquet ante elementum vitae.">
        </div>

        <div class="card">
            <div class="card-body">
                <h2>Texto</h2>
                <p class="texto" id="texto">Lorem ipsum dolor sit amet, consectetur adipiscing elit. Donec elementum auctor libero, vel imperdiet est. Etiam blandit facilisis ex, nec cursus metus pharetra quis. Fusce imperdiet nisl nibh, ac aliquet ante elementum vitae.</p>
                
                <hr class="hr">
                
                <h2>Opciones de Formato</h2>
                <div class="row">
                    <div class="col-12 col-md-3 my-1">
                        <button id="btn-negrita" class="btn d-block w-100 btn-outline-primary" data-formato="negrita">
                            Bold (Negrita)
                        </button>
                    </div>
                    <div class="col-12 col-md-3 my-1">
                        <button id="btn-cursiva" class="btn d-block w-100 btn-outline-primary" data-formato="cursiva">
                            Italic (Cursiva)
                        </button>
                    </div>
                    <div class="col-12 col-md-3 my-1">
                        <button id="btn-subrayado" class="btn d-block w-100 btn-outline-primary" data-formato="subrayado">
                            Underline (Subrayado)
                        </button>
                    </div>
                    <!-- Nuevo botón para cambiar el color del texto -->
                    <div class="col-12 col-md-3 my-1">
                        <button id="btn-color" class="btn d-block w-100 btn-outline-primary" data-formato="color">
                            Color Rojo
                        </button>
                    </div>
                </div>

                <!-- Control de tamaño de texto -->
                <div class="row mt-3">
                    <div class="col-12 col-md-6">
                        <label for="select-tamano" class="form-label fw-bold">Tamaño de Fuente:</label>
                        <select id="select-tamano" class="form-select">
                            <option value="16px" selected>Normal (16px)</option>
                            <option value="12px">Pequeño (12px)</option>
                            <option value="20px">Grande (20px)</option>
                            <option value="24px">Muy Grande (24px)</option>
                        </select>
                    </div>
                    <!-- Bonus Track: Alineación -->
                    <div class="col-12 col-md-6 mt-2 mt-md-0">
                        <label for="select-alineacion" class="form-label fw-bold">Alineación:</label>
                        <select id="select-alineacion" class="form-select">
                            <option value="left" selected>Izquierda</option>
                            <option value="center">Centro</option>
                            <option value="right">Derecha</option>
                            <option value="justify">Justificado</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>
    <script type="text/javascript">
        // Selección de elementos principales del DOM
        const textoEl = document.querySelector('#texto');
        const inputTextoEl = document.querySelector('#input-texto');
        const selectTamanoEl = document.querySelector('#select-tamano');
        const selectAlineacionEl = document.querySelector('#select-alineacion');

        /**
         * Actualiza el estado visual del botón según la clase esté activada o no
         */
        function actualizarEstadoBoton(idBoton, claseEstilo) {
            const btn = document.querySelector('#' + idBoton);
            if (textoEl.classList.contains(claseEstilo)) {
                btn.classList.remove('btn-outline-primary');
                btn.classList.add('btn-primary');
            } else {
                btn.classList.remove('btn-primary');
                btn.classList.add('btn-outline-primary');
            }
        }

        /**
         * funcionNegrita()
         */
        function funcionNegrita() {
            textoEl.classList.toggle('negrita');
            actualizarEstadoBoton('btn-negrita', 'negrita');
        }

        /**
         * funcionCursiva()
         */
        function funcionCursiva() {
            textoEl.classList.toggle('cursiva');
            actualizarEstadoBoton('btn-cursiva', 'cursiva');
        }

        /**
         * funcionSubrayado()
         */
        function funcionSubrayado() {
            textoEl.classList.toggle('subrayado');
            actualizarEstadoBoton('btn-subrayado', 'subrayado');
        }

        /**
         * funcionColor() - Nuevo botón
         */
        function funcionColor() {
            textoEl.classList.toggle('color-destacado');
            actualizarEstadoBoton('btn-color', 'color-destacado');
        }

        /**
         * Manejador de eventos de los botones de formato
         */
        function handlerBoton(e) {
            // Se lee el valor del atributo data-formato mediante la propiedad dataset
            const funcionBoton = e.target.dataset.formato;
            switch (funcionBoton) {
                case 'negrita':
                    funcionNegrita();
                    break;
                case 'cursiva':
                    funcionCursiva();
                    break;
                case 'subrayado':
                    funcionSubrayado();
                    break;
                case 'color':
                    funcionColor();
                    break;
            }
        }

        // Asignación de listeners a todos los botones
        document.querySelectorAll('button.btn').forEach(e => e.addEventListener('click', handlerBoton));

        // 1. Edición de texto en tiempo real
        inputTextoEl.addEventListener('input', () => {
            textoEl.innerText = inputTextoEl.value;
        });

        // 2. Control de tamaño de texto
        selectTamanoEl.addEventListener('change', (e) => {
            textoEl.style.fontSize = e.target.value;
        });

        // 3. Bonus Track: Control de alineación de texto
        selectAlineacionEl.addEventListener('change', (e) => {
            textoEl.style.textAlign = e.target.value;
        });
    </script>
</body>
</html>
