<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mi Lista de Contactos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
</head>
<body class="bg-light">

    <div class="container py-4">
        <h1 class="mb-4">TP-14</h1>
        
        <div class="card shadow-sm">
            <div class="card-body">
                <h2 class="h4 mb-3">Tus Contactos</h2>
                
                <!-- Barra de controles: ordenar y filtrar -->
                <div class="row g-3 align-items-center mb-4">
                    <div class="col-auto">
                        <label for="ordenarPor" class="col-form-label">Ordenar por:</label>
                    </div>
                    <div class="col-auto">
                        <select id="ordenarPor" class="form-select form-select-sm">
                            <option value="nombre">Nombre</option>
                            <option value="apellido">Apellido</option>
                        </select>
                    </div>
                    <div class="col-auto">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="filtroFavoritos">
                            <label class="form-check-label" for="filtroFavoritos">
                                 Ver solo favoritos
                            </label>
                        </div>
                    </div>
                </div>

                <!-- Acá se van a renderizar los contactos dinámicamente -->
                <ul id="lista-contactos" class="list-group mb-4"></ul>
                
                <hr>
                
                <h2 class="h4 mb-3">Agregar Nuevo Contacto</h2>
                <form id="form-producto">
                    <div class="row g-2 mb-3">
                        <div class="col-md">
                            <input type="text" class="form-control" id="input-nombre" placeholder="Nombre" required>
                        </div>
                        <div class="col-md">
                            <input type="text" class="form-control" id="input-apellido" placeholder="Apellido" required>
                        </div>
                        <div class="col-md">
                            <input type="tel" class="form-control" id="input-telefono" placeholder="Teléfono" required>
                        </div>
                    </div>
                    <button class="btn btn-primary" type="submit">Guardar Contacto</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>
    
    <script>
        // Nuestra base de datos temporal en memoria
        let contactos = [
            { nombre: 'Tehuel', apellido: 'Torrez', telefono: '1122334455', favorito: true },
            { nombre: 'Matias ', apellido: 'Micheltorena', telefono: '9988776655', favorito: false }
        ];

        // Elementos del DOM que vamos a usar seguido
        const contenedorLista = document.getElementById('lista-contactos');
        const selectOrden = document.getElementById('ordenarPor');
        const checkFavoritos = document.getElementById('filtroFavoritos');
        const formulario = document.getElementById('form-producto');

        // Función principal: dibuja la lista en la pantalla aplicando orden y filtros
        function mostrarListado() {
            // Limpiamos la lista antes de volver a pintarla
            contenedorLista.innerHTML = '';

            // 1. Armamos una copia de los contactos para ordenar sin romper el array original
            let resultados = [...contactos];

            // 2. Si el filtro de favoritos está activo, filtramos primero
            if (checkFavoritos.checked) {
                resultados = resultados.filter(c => c.favorito);
            }

            // 3. Ordenamos alfabéticamente según lo que el usuario haya elegido en el select
            const criterio = selectOrden.value;
            resultados.sort((a, b) => a[criterio].localeCompare(b[criterio]));

            // Si no hay contactos para mostrar, avisamos amablemente
            if (resultados.length === 0) {
                contenedorLista.innerHTML = `<li class="list-group-item text-muted text-center py-3">No hay contactos para mostrar.</li>`;
                return;
            }

            // 4. Dibujamos cada contacto en el DOM
            resultados.forEach(contacto => {
                // Buscamos su índice real en el array original (necesario para editar/marcar favorito)
                const indiceReal = contactos.indexOf(contacto);

                const item = document.createElement('li');
                item.className = 'list-group-item d-flex justify-content-between align-items-center py-2';
                
                item.innerHTML = `
                    <div>
                        <span class="fw-bold">${contacto.nombre} ${contacto.apellido}</span> 
                        <span class="text-muted ms-2"> ${contacto.telefono}</span>
                    </div>
                    <button class="btn btn-sm ${contacto.favorito ? 'btn-warning' : 'btn-outline-secondary'}" 
                            onclick="toggleFavorito(${indiceReal})">
                        ${contacto.favorito ? '★ Favorito' : '☆ Marcar'}
                    </button>
                `;
                
                contenedorLista.appendChild(item);
            });
        }

        // Agrega un nuevo contacto a la lista
        function agregarContacto(nombre, apellido, telefono) {
            contactos.push({
                nombre: nombre.trim(),
                apellido: apellido.trim(),
                telefono: telefono.trim(),
                favorito: false // Por defecto no es favorito
            });
            mostrarListado();
        }

        // Cambia el estado de favorito de un contacto (de true a false o viceversa)
        function toggleFavorito(indice) {
            contactos[indice].favorito = !contactos[indice].favorito;
            mostrarListado();
        }

        // Manejador del formulario cuando el usuario hace clic en "Guardar Contacto"
        function handlerFormulario(e) {
            e.preventDefault(); // Evitamos que la página se recargue

            const inputNombre = document.getElementById('input-nombre');
            const inputApellido = document.getElementById('input-apellido');
            const inputTelefono = document.getElementById('input-telefono');

            // Mandamos los datos a la función que los guarda
            agregarContacto(inputNombre.value, inputApellido.value, inputTelefono.value);

            // Limpiamos el formulario para el siguiente ingreso
            formulario.reset();
            inputNombre.focus(); // Devolvemos el cursor al primer campo por comodidad
        }

        // --- Event Listeners (Conectando acciones con la interfaz) ---
        formulario.addEventListener('submit', handlerFormulario);
        selectOrden.addEventListener('change', mostrarListado);
        checkFavoritos.addEventListener('change', mostrarListado);

        // Render inicial al cargar la página
        mostrarListado();
    </script>
</body>
</html>
